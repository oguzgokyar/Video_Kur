<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Shorts Otomasyon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen" x-data="{ sidebarOpen: false }">
  <!-- Layout template - bağımsız olarak kullanılmaz, referans amaçlıdır -->
  <div class="flex flex-col h-screen">
    <header class="bg-white shadow-md flex items-center justify-between px-6 py-3 z-30">
      <div class="flex items-center gap-3">
        <button class="md:hidden text-gray-600 hover:text-gray-900" @click="sidebarOpen = !sidebarOpen">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0C.488 3.45.029 5.804 0 12c.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0C23.512 20.55 23.971 18.196 24 12c-.029-6.185-.484-8.549-4.385-8.816zM9 16V8l8 4-8 4z"/></svg>
          </div>
          <span class="text-lg font-bold text-gray-800">Shorts Otomasyon</span>
        </div>
      </div>
    </header>
    <div class="flex flex-1 overflow-hidden">
      <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-black/30 z-20 md:hidden" x-transition.opacity></div>
      <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'" class="fixed md:static inset-y-0 left-0 z-30 w-60 bg-white border-r transform transition-transform duration-200 ease-in-out pt-16 md:pt-0">
        <nav class="flex flex-col p-4 gap-1">
          <!-- Menü linkleri buraya -->
        </nav>
      </aside>
      <main class="flex-1 overflow-y-auto p-6 md:p-8">
        <!-- Sayfa içeriği buraya -->
      </main>
    </div>
    <footer class="bg-white border-t text-center text-xs text-gray-400 py-3">© 2026 YouTube Shorts Otomasyon</footer>
  </div>
</body>
</html>
